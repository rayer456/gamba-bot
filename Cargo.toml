[package]
name = "gamba-bot"
version = "0.1.0"
edition = "2021"
default-run = "gamba-bot" # Run bot by CLI

[lib]
name = "gamba_bot"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12.5", features = ["blocking", "json"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
serde_yaml = "0.9"
toml = "0.8.16"
anyhow = "1.0.86"
open = "5.3.0"
base64-url = "2.0.2"
rand = "0.8.5"
tokio = { version = "1.42.0", features = ["full"] }
futures = "0.3"
urlencoding = "2.1.3"
slint = { version = "1.10.0" }
futures-util = "0.3.31"
tokio-tungstenite = { "version" = "0.27.0", features = ["native-tls"] }
tungstenite = "0.27.0"
chrono = "0.4.41"
date_component = "0.4.3"


[build-dependencies]
slint-build = "1.10.0"
